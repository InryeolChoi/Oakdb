[package]
name = "oakdb"
version = "0.1.0"
description = "Oakdb storage engine: a B+Tree key-value engine with a simple relational layer"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "single_page"
harness = false
